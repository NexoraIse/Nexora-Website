<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050610"/>
      <stop offset="50%" stop-color="#0e0e2a"/>
      <stop offset="100%" stop-color="#030617"/>
    </linearGradient>
    <linearGradient id="cpu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#818cf8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"/>
  <rect width="800" height="450" fill="url(#dotgrid)"/>

  <circle cx="400" cy="225" r="240" fill="#6366f1" fill-opacity="0.1" filter="url(#glow2)"/>
  <circle cx="200" cy="350" r="140" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Circuit traces to CPU -->
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" fill="none">
    <path d="M 120 80 H 260 V 170 H 330"/>
    <path d="M 680 80 H 540 V 170 H 470"/>
    <path d="M 120 370 H 260 V 280 H 330"/>
    <path d="M 680 370 H 540 V 280 H 470"/>
    <circle cx="120" cy="80" r="4" fill="#38bdf8"/>
    <circle cx="680" cy="80" r="4" fill="#38bdf8"/>
    <circle cx="120" cy="370" r="4" fill="#38bdf8"/>
    <circle cx="680" cy="370" r="4" fill="#38bdf8"/>
  </g>

  <!-- CPU Socket Outer -->
  <g transform="translate(310, 135)" filter="url(#glow2)">
    <!-- CPU base -->
    <rect width="180" height="180" rx="20" fill="#090d24" stroke="url(#cpu-grad)" stroke-width="2.5"/>
    
    <!-- CPU inner die -->
    <rect x="25" y="25" width="130" height="130" rx="14" fill="#11183c" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Core micro architecture patterns -->
    <rect x="40" y="40" width="45" height="45" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="95" y="40" width="45" height="45" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="40" y="95" width="45" height="45" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="95" y="95" width="45" height="45" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8"/>

    <!-- Central Tech Nova Icon -->
    <text x="90" y="70" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">TECH</text>
    <text x="90" y="85" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">NOVA</text>
    <text x="90" y="125" fill="#67e8f9" font-family="monospace" font-size="10" text-anchor="middle">ISE-FEST</text>

    <!-- CPU Pins -->
    <g fill="#38bdf8" fill-opacity="0.7">
      <rect x="50" y="-8" width="6" height="8" rx="2"/>
      <rect x="70" y="-8" width="6" height="8" rx="2"/>
      <rect x="90" y="-8" width="6" height="8" rx="2"/>
      <rect x="110" y="-8" width="6" height="8" rx="2"/>
      <rect x="130" y="-8" width="6" height="8" rx="2"/>

      <rect x="50" y="180" width="6" height="8" rx="2"/>
      <rect x="70" y="180" width="6" height="8" rx="2"/>
      <rect x="90" y="180" width="6" height="8" rx="2"/>
      <rect x="110" y="180" width="6" height="8" rx="2"/>
      <rect x="130" y="180" width="6" height="8" rx="2"/>
    </g>
  </g>

  <!-- Category badge -->
  <rect x="50" y="45" width="145" height="28" rx="14" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1"/>
  <text x="122" y="63" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1.5">TECHNICAL FEST</text>

  <!-- Corner tech accents -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#818cf8" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#818cf8" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#818cf8" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#818cf8" stroke-width="2"/>
</svg>
