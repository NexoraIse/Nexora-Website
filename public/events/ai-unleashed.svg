<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050610"/>
      <stop offset="50%" stop-color="#0a152b"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
    <linearGradient id="neural-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)"/>

  <!-- Neural Mesh background -->
  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" fill="none">
    <line x1="80" y1="120" x2="220" y2="80"/>
    <line x1="220" y1="80" x2="350" y2="140"/>
    <line x1="350" y1="140" x2="480" y2="90"/>
    <line x1="480" y1="90" x2="650" y2="150"/>
    <line x1="120" y1="320" x2="280" y2="360"/>
    <line x1="280" y1="360" x2="450" y2="310"/>
    <line x1="450" y1="310" x2="620" y2="350"/>
  </g>

  <!-- Large glow orb -->
  <circle cx="400" cy="225" r="210" fill="#06b6d4" fill-opacity="0.12" filter="url(#glow3)"/>
  <circle cx="400" cy="225" r="130" fill="#a855f7" fill-opacity="0.1" filter="url(#glow3)"/>

  <!-- Neural Network Brain Circuit Centerpiece -->
  <g transform="translate(400, 225)" filter="url(#glow3)">
    <!-- Central AI Core -->
    <circle cx="0" cy="0" r="48" fill="#030712" stroke="url(#neural-grad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <text x="0" y="6" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">AI</text>

    <!-- Synaptic Nodes Layer 1 -->
    <!-- Top Left -->
    <line x1="-34" y1="-34" x2="-90" y2="-75" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-90" cy="-75" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-90" cy="-75" r="6" fill="#38bdf8"/>

    <!-- Top Right -->
    <line x1="34" y1="-34" x2="90" y2="-75" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="90" cy="-75" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <circle cx="90" cy="-75" r="6" fill="#a855f7"/>

    <!-- Bottom Left -->
    <line x1="-34" y1="34" x2="-90" y2="75" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-90" cy="75" r="16" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="-90" cy="75" r="6" fill="#06b6d4"/>

    <!-- Bottom Right -->
    <line x1="34" y1="34" x2="90" y2="75" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="90" cy="75" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="90" cy="75" r="6" fill="#38bdf8"/>

    <!-- Outer Nodes Layer 2 -->
    <line x1="-90" y1="-75" x2="-170" y2="-60" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4,4"/>
    <circle cx="-170" cy="-60" r="10" fill="#0e1726" stroke="#38bdf8" stroke-width="1.5"/>

    <line x1="90" y1="-75" x2="170" y2="-60" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="4,4"/>
    <circle cx="170" cy="-60" r="10" fill="#0e1726" stroke="#c084fc" stroke-width="1.5"/>

    <line x1="-90" y1="75" x2="-170" y2="60" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="4,4"/>
    <circle cx="-170" cy="60" r="10" fill="#0e1726" stroke="#06b6d4" stroke-width="1.5"/>

    <line x1="90" y1="75" x2="170" y2="60" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4,4"/>
    <circle cx="170" cy="60" r="10" fill="#0e1726" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Category badge -->
  <rect x="50" y="45" width="180" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
  <text x="140" y="63" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1.2">ARTIFICIAL INTELLIGENCE</text>

  <!-- Corner tech brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#06b6d4" stroke-width="2"/>
</svg>
