<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050610"/>
      <stop offset="50%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#030816"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="code-acc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Radial atmospheric glow -->
  <circle cx="400" cy="225" r="220" fill="#38bdf8" fill-opacity="0.12" filter="url(#neon-glow)"/>
  <circle cx="650" cy="100" r="160" fill="#818cf8" fill-opacity="0.08"/>

  <!-- Circuit lines -->
  <path d="M 50 120 L 220 120 L 280 180 L 520 180 L 580 240 L 750 240" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6,6"/>
  <path d="M 80 340 L 260 340 L 320 280 L 500 280 L 560 340 L 720 340" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Code Terminal Window -->
  <g transform="translate(180, 85)">
    <rect width="440" height="280" rx="16" fill="#030712" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" filter="url(#neon-glow)"/>
    <!-- Header bar -->
    <rect width="440" height="38" rx="16" fill="#0f172a" fill-opacity="0.9"/>
    <circle cx="25" cy="19" r="5" fill="#f43f5e" fill-opacity="0.8"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="59" cy="19" r="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="220" y="24" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">nexora-codewars://arena.sh</text>

    <!-- Code lines and hacker prompt -->
    <text x="35" y="75" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">$ npx run code-wars --mode=hackathon</text>
    <text x="35" y="105" fill="#a78bfa" font-family="monospace" font-size="13">&gt; Initializing algorithmic challenges...</text>
    <text x="35" y="130" fill="#64748b" font-family="monospace" font-size="12">// Teams connected: 64 | Difficulty: Hard</text>
    <text x="35" y="155" fill="#34d399" font-family="monospace" font-size="13">const solution = optimize(algorithm, O(logN));</text>
    <text x="35" y="180" fill="#38bdf8" font-family="monospace" font-size="13">if (solution.verified) { deploy(); }</text>

    <!-- Glowing Code Icon Symbol -->
    <g transform="translate(170, 200)" filter="url(#neon-glow)">
      <path d="M 20 40 L -5 20 L 20 0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 80 0 L 105 20 L 80 40" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="60" y1="-5" x2="40" y2="45" stroke="#a78bfa" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Cyber Badge overlay -->
  <rect x="50" y="45" width="130" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="115" y="63" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1.5">HACKATHON</text>

  <!-- Corner tech brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#38bdf8" stroke-width="2"/>
</svg>
